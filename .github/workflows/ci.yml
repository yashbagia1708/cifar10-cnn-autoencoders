name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install matplotlib pytest
      # random tensors, not CIFAR-10: the dataset's host is too slow to download from CI
      - run: pytest -q
